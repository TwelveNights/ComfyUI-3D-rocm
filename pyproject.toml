[project]
name = "comfyui-3d-rocm"
version = "1.0.4"
description = "Image to textured 3D asset on AMD Radeon and Instinct GPUs (ROCm), Windows and Linux: TripoSG image-to-mesh and Hunyuan3D-2.1 PBR texturing as ComfyUI nodes, with no CUDA or C++ extensions to build. Also paints meshes from ComfyUI's own Hunyuan3D-2.1 nodes. Setup: install here and restart (Manager installs the Python packages from requirements.txt; nothing pins torch, so your ROCm PyTorch stays), then open Templates > Extensions > comfyui-3d-rocm. TripoSG and the painter download their models (18 GB) on the first run."
readme = "README.md"
license = "Apache-2.0 AND MIT AND LicenseRef-Tencent-Hunyuan-3D-2.1-Community"
license-files = ["LICENSE", "vendor/triposg_pkg/LICENSE", "vendor/hy3dpaint/LICENSE", "vendor/hy3dpaint/Notice.txt"]
requires-python = ">=3.10"
# Same as requirements.txt. None of them depends on a specific torch, so pip keeps the installed (ROCm) PyTorch.
dependencies = [
  "diffusers>=0.32",
  "transformers>=4.46",
  "huggingface_hub",
  "einops",
  "omegaconf",
  "jaxtyping",
  "typeguard",
  "scikit-image",
  "trimesh",
  "pymeshlab",
  "xatlas",
  "opencv-python-headless",
  "spandrel",
  "fast-simplification",
]

[project.urls]
Repository = "https://github.com/TwelveNights/ComfyUI-3D-rocm"

[tool.ruff]
line-length = 120
exclude = ["vendor"]

[tool.comfy]
requires-comfyui = ">=0.34.0"
PublisherId = "twelvenights"
DisplayName = "3D generation (ROCm): TripoSG + Hunyuan3D-2.1 Paint"
Icon = "https://raw.githubusercontent.com/TwelveNights/ComfyUI-3D-rocm/main/assets/icon.png"
